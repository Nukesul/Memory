# Supabase pauses free projects after 7 days without activity.
# This workflow touches the database twice a week so the class site never goes to sleep.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions).
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
